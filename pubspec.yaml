name: makkal_velicham
description: "Makkal Velicham - Tamil news with center-fold page flip experience."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  go_router: ^15.1.2
  dio: ^5.8.0
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.1.1
  shared_preferences: ^2.3.3
  uuid: ^4.4.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/auth/
    - assets/images/intro/
